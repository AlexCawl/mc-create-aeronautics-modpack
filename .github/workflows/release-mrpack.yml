name: Release mrpack

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest

      - name: Build mrpack
        run: scripts/build-mrpack.sh dist/mc-create-aeronautics.mrpack

      - name: Move rolling tag
        if: github.event_name == 'push'
        run: |
          git tag -f master-latest "$GITHUB_SHA"
          git push -f origin refs/tags/master-latest

      - name: Publish rolling release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes='Rolling bootstrap modpack built from `'"$GITHUB_SHA"'` on `master`.

          Use the attached `mc-create-aeronautics.mrpack` in Prism Launcher and as the server `MODRINTH_MODPACK` URL.'

          if gh release view master-latest >/dev/null 2>&1; then
            gh release edit master-latest \
              --title master-latest \
              --notes "$notes" \
              --prerelease \
              --latest=false
          else
            gh release create master-latest \
              --title master-latest \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload master-latest dist/mc-create-aeronautics.mrpack --clobber

      - name: Resolve next immutable release tag
        if: github.event_name == 'workflow_dispatch'
        id: next-tag
        run: |
          max=0
          tags="$(git ls-remote --tags origin 'refs/tags/v*' | awk '
            {
              sub(/^refs\/tags\//, "", $2)
              sub(/\^\{\}$/, "", $2)
              if ($2 ~ /^v[0-9]+$/) print $2
            }
          ')"

          for tag in $tags; do
            case "$tag" in
              v*[!0-9]*|'') continue ;;
              v*) number="${tag#v}" ;;
              *) continue ;;
            esac

            if [ "$number" -gt "$max" ]; then
              max="$number"
            fi
          done

          next=$((max + 1))
          immutable_tag="v$next"

          if git ls-remote --exit-code --tags origin "refs/tags/$immutable_tag" >/dev/null 2>&1; then
            echo "Tag $immutable_tag already exists; immutable releases are not overwritten." >&2
            exit 1
          fi

          echo "immutable_tag=$immutable_tag" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.next-tag.outputs.immutable_tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

          notes='Immutable bootstrap modpack release built from `'"$GITHUB_SHA"'`.

          Use the attached `mc-create-aeronautics.mrpack` in Prism Launcher and as a pinned server `MODRINTH_MODPACK` URL.'

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            --latest=false \
            dist/mc-create-aeronautics.mrpack
