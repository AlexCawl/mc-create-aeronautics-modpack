name: Release mrpack

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag to create, for example v0.1.0. Leave empty to refresh master-latest."
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build mrpack
        run: scripts/build-mrpack.sh dist/mc-create-aeronautics.mrpack

      - name: Move rolling tag
        if: github.event_name == 'push' || inputs.release_tag == ''
        run: |
          git tag -f master-latest "$GITHUB_SHA"
          git push -f origin refs/tags/master-latest

      - name: Publish rolling release
        if: github.event_name == 'push' || inputs.release_tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes='Rolling bootstrap modpack built from `'"$GITHUB_SHA"'` on `master`.

          Use the attached `mc-create-aeronautics.mrpack` in Prism Launcher and as the server `MODRINTH_MODPACK` URL.'

          if gh release view master-latest >/dev/null 2>&1; then
            gh release edit master-latest \
              --title master-latest \
              --notes "$notes" \
              --prerelease \
              --latest=false
          else
            gh release create master-latest \
              --title master-latest \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload master-latest dist/mc-create-aeronautics.mrpack --clobber

      - name: Publish immutable release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          case "$RELEASE_TAG" in
            v*) ;;
            *)
              echo "Manual release tags must start with v, for example v0.1.0" >&2
              exit 1
              ;;
          esac

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists; immutable releases are not overwritten." >&2
            exit 1
          fi

          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

          notes='Immutable bootstrap modpack release built from `'"$GITHUB_SHA"'`.

          Use the attached `mc-create-aeronautics.mrpack` in Prism Launcher and as a pinned server `MODRINTH_MODPACK` URL.'

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            --latest=false \
            dist/mc-create-aeronautics.mrpack
