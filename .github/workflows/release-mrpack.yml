name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  MRPACK_ARTIFACT: mc-create-aeronautics-client.mrpack
  SERVER_IMAGE: ghcr.io/alexcawl/mc-create-aeronautics-server

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      immutable: ${{ steps.release.outputs.immutable }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "release_tag=master-latest" >> "$GITHUB_OUTPUT"
            echo "immutable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max=0
          tags="$(git ls-remote --tags origin 'refs/tags/v*' | awk '
            {
              sub(/^refs\/tags\//, "", $2)
              sub(/\^\{\}$/, "", $2)
              if ($2 ~ /^v[0-9]+$/) print $2
            }
          ')"

          for tag in $tags; do
            case "$tag" in
              v*[!0-9]*|'') continue ;;
              v*) number="${tag#v}" ;;
              *) continue ;;
            esac

            if [ "$number" -gt "$max" ]; then
              max="$number"
            fi
          done

          next=$((max + 1))
          release_tag="v$next"

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Tag $release_tag already exists; immutable releases are not overwritten." >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "immutable=true" >> "$GITHUB_OUTPUT"

  build-mrpack:
    runs-on: ubuntu-latest
    needs:
      - metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: |
          go install github.com/packwiz/packwiz@latest

      - name: Build mrpack
        run: scripts/build-mrpack.sh "dist/${MRPACK_ARTIFACT}"

      - name: Upload mrpack artifact
        uses: actions/upload-artifact@v4
        with:
          name: mrpack
          path: dist/${{ env.MRPACK_ARTIFACT }}
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build-mrpack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mrpack artifact
        uses: actions/download-artifact@v4
        with:
          name: mrpack
          path: dist

      - name: Publish rolling release
        if: needs.metadata.outputs.immutable == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$RELEASE_TAG"

          notes='Rolling bootstrap modpack built from `'"$GITHUB_SHA"'` on `master`.

          Use the attached `mc-create-aeronautics-client.mrpack` in Prism Launcher. The server image is published to `ghcr.io/alexcawl/mc-create-aeronautics-server:'"$RELEASE_TAG"'`.'

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi

          gh release upload "$RELEASE_TAG" "dist/${MRPACK_ARTIFACT}" --clobber

      - name: Publish immutable release
        if: needs.metadata.outputs.immutable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

          notes='Immutable bootstrap modpack release built from `'"$GITHUB_SHA"'`.

          Use the attached `mc-create-aeronautics-client.mrpack` in Prism Launcher. The matching server image is published to `ghcr.io/alexcawl/mc-create-aeronautics-server:'"$RELEASE_TAG"'`.'

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$notes" \
            --latest=false \
            "dist/${MRPACK_ARTIFACT}"

  publish-server-image:
    runs-on: ubuntu-latest
    needs:
      - metadata
      - publish-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/minecraft/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.SERVER_IMAGE }}:${{ needs.metadata.outputs.release_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.release_tag }}
