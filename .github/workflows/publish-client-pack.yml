name: Publish client pack

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

env:
  MRPACK_ARTIFACT: mc-create-aeronautics-client.mrpack
  CURSEFORGE_ARTIFACT: mc-create-aeronautics-client-curseforge.zip

jobs:
  publish-client-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Build mrpack
        run: scripts/build-mrpack.sh "dist/${MRPACK_ARTIFACT}"

      - name: Build CurseForge zip
        run: |
          mkdir -p dist .cache/packwiz
          cd modpack
          "$HOME/go/bin/packwiz" --cache "$GITHUB_WORKSPACE/.cache/packwiz" curseforge export -o "$GITHUB_WORKSPACE/dist/${CURSEFORGE_ARTIFACT}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

          release_notes="Client pack release built from \`$GITHUB_SHA\`.

          Use \`mc-create-aeronautics-client.mrpack\` in Prism Launcher. The CurseForge-compatible export is attached as \`mc-create-aeronautics-client-curseforge.zip\`. The matching server image is published with the same tag and as \`latest\`."

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes "$release_notes" \
            --latest=true \
            "dist/${MRPACK_ARTIFACT}" \
            "dist/${CURSEFORGE_ARTIFACT}"
