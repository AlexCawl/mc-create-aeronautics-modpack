name: Publish mod zips

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: write

env:
  CLIENT_MODS_ARTIFACT: client-mods.zip
  SERVER_MODS_ARTIFACT: server-mods.zip

jobs:
  publish-mod-zips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build raw mod zips
        run: scripts/build-mod-zips.sh "dist/${CLIENT_MODS_ARTIFACT}" "dist/${SERVER_MODS_ARTIFACT}"

      - name: Upload mod zips to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            --clobber \
            "dist/${CLIENT_MODS_ARTIFACT}" \
            "dist/${SERVER_MODS_ARTIFACT}"
